name: Release Betul Nagar Android app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version display name (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Capacitor Android Native APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename & prepare APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Betul-311-Staff-v${{ inputs.version_name || '1.0.0' }}.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Betul-311-Staff-APK
          path: release-output/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version_name || '1.0.0') }}
          name: Betul 311 Staff & Municipal Citizen App ${{ inputs.version_name || github.ref_name }}
          files: release-output/*.apk
          generate_release_notes: true
          make_latest: true
