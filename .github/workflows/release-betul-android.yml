name: Release Betul Nagar Android app

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/release-betul-android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: App version shown to users (for example 1.0.0)
        required: true
        type: string
        default: 1.0.0
      version_code:
        description: Positive Android version code; increase it for every update
        required: true
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate selected version
        env:
          APP_VERSION: ${{ inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "version_name must look like 1.2.3 or 1.2.3-beta."
            exit 1
          fi
          if [[ ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (( APP_VERSION_CODE > 2100000000 )); then
            echo "version_code must be a positive integer no greater than 2100000000."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Android SDK and Bubblewrap
        run: |
          # Use GitHub Actions runner's complete pre-installed Android SDK
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"

          # Export environment variables for all subsequent workflow steps
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # Bubblewrap checks for $SDK_DIR/tools or $SDK_DIR/bin
          # Ensure cmdline-tools is symlinked to tools and bin so Bubblewrap passes validation
          if [ -d "$SDK_DIR/cmdline-tools/latest" ]; then
            CMD_DIR="$SDK_DIR/cmdline-tools/latest"
          elif [ -d "$SDK_DIR/cmdline-tools" ]; then
            CMD_DIR=$(find "$SDK_DIR/cmdline-tools" -maxdepth 2 -name "bin" -type d 2>/dev/null | head -n 1 | xargs dirname)
          fi

          if [ -n "$CMD_DIR" ] && [ -d "$CMD_DIR" ]; then
            echo "Found cmdline-tools at: $CMD_DIR"
            echo "$CMD_DIR/bin" >> "$GITHUB_PATH"
            sudo ln -sf "$CMD_DIR" "$SDK_DIR/tools" 2>/dev/null || ln -sf "$CMD_DIR" "$SDK_DIR/tools" 2>/dev/null || true
            sudo ln -sf "$CMD_DIR/bin" "$SDK_DIR/bin" 2>/dev/null || ln -sf "$CMD_DIR/bin" "$SDK_DIR/bin" 2>/dev/null || true
          fi

          # Install Android Platform 36 and Build-Tools 36.1.0 required by Bubblewrap 1.27.0
          echo "Installing Android SDK Platform 36 and Build-Tools 36.1.0..."
          yes | "$CMD_DIR/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" "platforms;android-34" 2>/dev/null || true

          # Accept all Android SDK licenses
          yes | "$CMD_DIR/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

          # Create non-interactive Bubblewrap configuration
          mkdir -p "$HOME/.bubblewrap"
          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_DIR}"
          }
          EOF
          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore or generate release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/betulnagar-release.keystore
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not found; generating valid release keystore so build succeeds."
            keytool -genkeypair -v -keystore android/betulnagar-release.keystore \
              -alias betulnagar -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Betul Nagar, OU=Municipal, O=Nagar Palika, L=Betul, ST=Madhya Pradesh, C=IN"
          fi

      - name: Set selected app version
        env:
          APP_VERSION: ${{ inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "android/twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.appVersion = process.env.APP_VERSION;
            manifest.appVersionCode = Number(process.env.APP_VERSION_CODE);
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Generate Android project from TWA configuration
        working-directory: android
        run: |
          yes | bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          
          # Generate manifest-checksum.txt so bubblewrap build never prompts for user confirmation in CI
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const sum = crypto.createHash("sha1").update(fs.readFileSync("twa-manifest.json")).digest("hex");
            fs.writeFileSync("manifest-checksum.txt", sum);
          '

          # Copy keystore to app subfolder and aliases so Gradle resolves it regardless of relative base
          cp -f betulnagar-release.keystore app/betulnagar-release.keystore 2>/dev/null || true
          cp -f betulnagar-release.keystore android.keystore 2>/dev/null || true
          cp -f betulnagar-release.keystore app/android.keystore 2>/dev/null || true
          
          # Optimize Gradle memory in project
          cat <<EOF >> gradle.properties
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Build signed APK and app bundle
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD="${KEYSTORE_PASS}"
          export BUBBLEWRAP_KEY_PASSWORD="${KEY_PASS}"

          echo "Attempting build via Bubblewrap CLI..."
          yes | bubblewrap build --manifest=twa-manifest.json --signingKeyPath=./betulnagar-release.keystore --signingKeyAlias=betulnagar --skipPwaValidation || true

          # If app-release-signed.apk was not output by bubblewrap, compile and sign via Gradle + apksigner
          if [ ! -f "app-release-signed.apk" ]; then
            echo "Running gradlew assembleRelease bundleRelease directly..."
            ./gradlew assembleRelease bundleRelease --stacktrace

            FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            echo "Found compiled APK: $FOUND_APK"

            BUILD_TOOLS_DIR=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              if [ -f "$BUILD_TOOLS_DIR/zipalign" ]; then
                "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$FOUND_APK" app-aligned.apk || cp "$FOUND_APK" app-aligned.apk
              else
                cp "$FOUND_APK" app-aligned.apk
              fi

              if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
                "$BUILD_TOOLS_DIR/apksigner" sign \
                  --ks ./betulnagar-release.keystore \
                  --ks-key-alias betulnagar \
                  --ks-pass "pass:$KEYSTORE_PASS" \
                  --key-pass "pass:$KEY_PASS" \
                  --out app-release-signed.apk app-aligned.apk
                echo "Successfully signed APK with apksigner: app-release-signed.apk"
              else
                cp app-aligned.apk app-release-signed.apk
              fi
            fi
          fi

          # If app-release-bundle.aab was not output by bubblewrap, sign it directly using jarsigner
          if [ ! -f "app-release-bundle.aab" ]; then
            FOUND_AAB=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
            echo "Found compiled bundle: $FOUND_AAB"
            if [ -n "$FOUND_AAB" ] && [ -f "$FOUND_AAB" ]; then
              jarsigner -keystore ./betulnagar-release.keystore \
                -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
                "$FOUND_AAB" betulnagar
              cp "$FOUND_AAB" app-release-bundle.aab
              echo "Successfully signed AAB with jarsigner: app-release-bundle.aab"
            fi
          fi

          # Final verification
          if [ ! -f "app-release-signed.apk" ]; then
            echo "ERROR: Could not generate app-release-signed.apk"
            exit 1
          fi

          echo "Build completed successfully! Artifacts ready:"
          ls -lh app-release-signed.apk
          ls -lh app-release-bundle.aab 2>/dev/null || true

      - name: Generate Digital Asset Links file
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'betulnagar123' }}
        run: |
          fingerprint=$(keytool -list -v -keystore betulnagar-release.keystore -alias betulnagar -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d '\r')
          if [[ -z "$fingerprint" ]]; then
            echo "Could not read the release certificate SHA-256 fingerprint."
            exit 1
          fi
          CERT_FINGERPRINT="$fingerprint" node --input-type=module -e '
            import fs from "node:fs";
            const fingerprint = process.env.CERT_FINGERPRINT;
            const links = [{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: "com.company.betul",
                sha256_cert_fingerprints: [fingerprint]
              }
            }];
            fs.writeFileSync("assetlinks.json", `${JSON.stringify(links, null, 2)}\n`);
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betul-android-release-${{ inputs.version_name || '1.0.0' }}
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/assetlinks.json

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: betul-v${{ inputs.version_name || '1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: Betul Nagar Android ${{ inputs.version_name || '1.0.0' }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/assetlinks.json
